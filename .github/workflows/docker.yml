name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  # 所有正式版本标签共享同一发布门，避免两个 tag workflow 在检查后
  # 交错覆盖 latest/系列标签；普通分支与 PR 仍按 ref 隔离。
  group: docker-${{ startsWith(github.ref, 'refs/tags/v') && 'release-promotion' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  SOURCE_SHA: ${{ github.sha }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with: {node-version: "24", package-manager-cache: false}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-release-runtime.lock

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python -m pip install --require-hashes -r requirements-release-runtime.lock
          python -m pip install "pytest==9.1.1"
          python -c 'from importlib.metadata import version; assert version("pytest") == "9.1.1"'
          python -m pip check

      - name: Validate Python and JavaScript syntax
        run: |
          python -m compileall -q app packaging tests
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find app/static/js -type f -name '*.js' ! -name '*.min.js' -print0)

      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
          MEDIAFLUX_TESTING: "1"
          MEDIAFLUX_TEST_MODE: "1"
          MEDIAFLUX_DISABLE_FILE_LOGGING: "1"
        run: python -m pytest tests -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-release-runtime.lock

      - name: Install browser test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-release-runtime.lock
          python -m pip install "playwright==1.62.0"
          python -c 'from importlib.metadata import version; assert version("playwright") == "1.62.0"'
          python -m pip check

      - name: Verify system Chrome or Chromium
        run: |
          set -euo pipefail
          browser_path="$(
            command -v google-chrome ||
            command -v google-chrome-stable ||
            command -v chromium ||
            command -v chromium-browser ||
            true
          )"
          if [[ -z "$browser_path" ]]; then
            echo "Chrome/Chromium is required for browser regression tests" >&2
            exit 1
          fi
          "$browser_path" --version

      - name: Run real browser regression tests without skips
        env:
          PYTHONUNBUFFERED: "1"
          MEDIAFLUX_TESTING: "1"
          MEDIAFLUX_TEST_MODE: "1"
          MEDIAFLUX_DISABLE_FILE_LOGGING: "1"
        run: |
          python - <<'PY'
          import unittest

          modules = (
              "tests.test_agent_browser",
              "tests.test_guangya_directory_scrape_browser",
              "tests.test_guangya_directory_scrape_ui",
              "tests.test_media_profile_in_place_ui",
              "tests.test_navigation_discovery_ui",
              "tests.test_window_viewport_inset",
          )
          suite = unittest.defaultTestLoader.loadTestsFromNames(modules)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              for test, reason in result.skipped:
                  print(f"Browser test skipped: {test}: {reason}")
          raise SystemExit(
              0 if result.wasSuccessful() and not result.skipped else 1
          )
          PY

  smoke:
    needs: [test, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Build amd64 smoke image
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$SOURCE_SHA")
          docker build \
            --build-arg VERSION_REF=v0.0.0-ci \
            --build-arg GIT_SHA="$SOURCE_SHA" \
            --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            --tag mediaflux:smoke .
      - name: Start image and wait for health check
        env:
          WEB_SECRET_KEY: ci-smoke-secret-key-with-more-than-32-bytes
          MEDIAFLUX_INITIALIZED: "1"
          ENV_WEB_PASSPORT: admin
          ENV_WEB_PASSWORD: ci-smoke-password-with-more-than-16-bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediaflux-db" "$RUNNER_TEMP/mediaflux-strm"
          sudo chown -R 10001:10001 "$RUNNER_TEMP/mediaflux-db" "$RUNNER_TEMP/mediaflux-strm"
          docker run --detach --name mediaflux-smoke \
            --publish 127.0.0.1:1258:1258 \
            --env WEB_SECRET_KEY --env MEDIAFLUX_INITIALIZED \
            --env ENV_WEB_PASSPORT --env ENV_WEB_PASSWORD \
            --volume "$RUNNER_TEMP/mediaflux-db:/app/db" \
            --volume "$RUNNER_TEMP/mediaflux-strm:/data/strm" \
            mediaflux:smoke
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:1258/readyz >/dev/null 2>&1; then
              docker exec mediaflux-smoke python mediaflux.py version --json > "$RUNNER_TEMP/docker-version.json"
              jq -e --arg sha "$SOURCE_SHA" \
                '.version == "0.0.0-ci" and .package == "docker" and .commit == $sha' \
                "$RUNNER_TEMP/docker-version.json"
              curl --fail --silent --show-error \
                http://127.0.0.1:1258/healthz >/dev/null
              docker exec mediaflux-smoke python mediaflux.py doctor --json \
                > "$RUNNER_TEMP/docker-doctor.json"
              jq -e 'all(.[]; .status != "error")' \
                "$RUNNER_TEMP/docker-doctor.json"
              curl --fail --silent --show-error \
                http://127.0.0.1:1258/static/js/app.js >/dev/null
              source_app_js_bytes=$(wc -c < app/static/js/app.js)
              image_app_js_bytes=$(docker exec mediaflux-smoke sh -c \
                'wc -c < /app/app/static/js/app.js')
              test "$image_app_js_bytes" -lt "$source_app_js_bytes"
              docker exec mediaflux-smoke sh -c '! command -v node >/dev/null 2>&1'
              exit 0
            fi
            sleep 2
          done
          docker logs mediaflux-smoke
          exit 1
      - name: Verify graceful container shutdown
        if: success()
        run: |
          docker stop --timeout 60 mediaflux-smoke >/dev/null
          shutdown_exit=$(docker inspect --format '{{.State.ExitCode}}' mediaflux-smoke)
          case "$shutdown_exit" in
            0|143) ;;
            *) echo "Unexpected container shutdown exit code: $shutdown_exit" >&2; exit 1 ;;
          esac
          docker logs mediaflux-smoke > "$RUNNER_TEMP/docker-smoke-shutdown.log" 2>&1
          cat "$RUNNER_TEMP/docker-smoke-shutdown.log"
          grep -Fq "Application shutdown complete" "$RUNNER_TEMP/docker-smoke-shutdown.log"
      - name: Smoke test persisted v0.1.4 database upgrade
        if: success()
        env:
          WEB_SECRET_KEY: ci-upgrade-secret-key-with-more-than-32-bytes
          MEDIAFLUX_INITIALIZED: "1"
          ENV_WEB_PASSPORT: admin
          ENV_WEB_PASSWORD: ci-upgrade-password-with-more-than-16-bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mediaflux-v014-db" "$RUNNER_TEMP/mediaflux-v014-strm"
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          database = Path("${{ runner.temp }}") / "mediaflux-v014-db" / "mediaflux.db"
          fixture = Path("tests/fixtures/database/v0.1.4-schema.sql")
          connection = sqlite3.connect(database)
          try:
              connection.executescript(fixture.read_text(encoding="utf-8"))
              connection.execute(
                  "INSERT INTO settings_kv(key,value,updated_at) VALUES(?,?,?)",
                  ("docker_upgrade_sentinel", "preserved", "2026-08-25"),
              )
              legacy_organize_key = "organize-summary:docker-upgrade:100"
              legacy_organize_body = (
                  "<b>✅ 光鸭整理完成</b>\n"
                  "- <b>结果：</b> 已移动 1 · 失败 0\n"
                  "<blockquote>升级迁移测试 &amp; 安全正文</blockquote>"
              )
              connection.execute(
                  "INSERT INTO organize_notification_outbox("
                  "idempotency_key,chat_id,body,image_url,status,attempts,"
                  "lease_generation,next_attempt_at,last_error,sent_at,"
                  "created_at,updated_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?)",
                  (
                      legacy_organize_key,
                      "100",
                      legacy_organize_body,
                      "poster.jpg",
                      "retry_wait",
                      2,
                      3,
                      # Keep the retry non-due while the live notifier starts,
                      # otherwise the smoke assertion races the background drain.
                      "2099-01-01 00:00:00",
                      "temporary",
                      None,
                      "2026-09-01 12:00:00",
                      "2026-09-01 12:01:00",
                  ),
              )
              connection.execute("PRAGMA user_version=1")
              connection.commit()
          finally:
              connection.close()
          PY
          sudo chown -R 10001:10001 \
            "$RUNNER_TEMP/mediaflux-v014-db" "$RUNNER_TEMP/mediaflux-v014-strm"
          docker run --detach --name mediaflux-v014-upgrade \
            --publish 127.0.0.1:1259:1258 \
            --env WEB_SECRET_KEY --env MEDIAFLUX_INITIALIZED \
            --env ENV_WEB_PASSPORT --env ENV_WEB_PASSWORD \
            --volume "$RUNNER_TEMP/mediaflux-v014-db:/app/db" \
            --volume "$RUNNER_TEMP/mediaflux-v014-strm:/data/strm" \
            mediaflux:smoke
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:1259/readyz >/dev/null 2>&1; then
              docker exec -i mediaflux-v014-upgrade python - <<'PY'
          import hashlib
          import json
          import sqlite3

          from app.database import SCHEMA_VERSION

          connection = sqlite3.connect("/app/db/mediaflux.db")
          try:
              version = int(connection.execute("PRAGMA user_version").fetchone()[0])
              sentinel = connection.execute(
                  "SELECT value FROM settings_kv WHERE key='docker_upgrade_sentinel'"
              ).fetchone()
              outbox = connection.execute(
                  "SELECT 1 FROM sqlite_master WHERE type='table' "
                  "AND name='strm_metadata_refresh_outbox'"
              ).fetchone()
              legacy_organize_table = connection.execute(
                  "SELECT 1 FROM sqlite_master WHERE type='table' "
                  "AND name='organize_notification_outbox'"
              ).fetchone()
              legacy_event_key = "retired-organize:" + hashlib.sha256(
                  b"organize-summary:docker-upgrade:100"
              ).hexdigest()
              legacy_notification = connection.execute(
                  "SELECT topic,importance,chat_id,event_json,revision,"
                  "delivered_revision,status,attempts,lease_generation,"
                  "next_attempt_at,last_error,sent_at "
                  "FROM telegram_notification_outbox WHERE event_key=?",
                  (legacy_event_key,),
              ).fetchone()
              integrity = connection.execute("PRAGMA integrity_check").fetchone()[0]
              foreign_keys = connection.execute("PRAGMA foreign_key_check").fetchall()
              assert version == SCHEMA_VERSION, (version, SCHEMA_VERSION)
              assert sentinel == ("preserved",), sentinel
              assert outbox == (1,), outbox
              assert legacy_organize_table is None, legacy_organize_table
              assert legacy_notification is not None, legacy_notification
              assert legacy_notification[:3] == ("organize", "result", "100")
              event = json.loads(legacy_notification[3])
              assert event["title"] == "✅ 光鸭整理完成", event
              assert event["lines"] == [
                  "- 结果： 已移动 1 · 失败 0",
                  "升级迁移测试 & 安全正文",
              ], event
              assert event["image_url"] == "poster.jpg", event
              assert "<" not in event["title"] + "\n".join(event["lines"]), event
              assert legacy_notification[4:] == (
                  1,
                  0,
                  "retry_wait",
                  2,
                  3,
                  "2099-01-01 00:00:00",
                  "temporary",
                  None,
              ), legacy_notification
              assert integrity == "ok", integrity
              assert foreign_keys == [], foreign_keys
          finally:
              connection.close()
          PY
              docker exec mediaflux-v014-upgrade python mediaflux.py doctor --json \
                > "$RUNNER_TEMP/docker-v014-doctor.json"
              jq -e 'all(.[]; .status != "error")' \
                "$RUNNER_TEMP/docker-v014-doctor.json"
              docker stop --timeout 60 mediaflux-v014-upgrade >/dev/null
              shutdown_exit=$(docker inspect --format '{{.State.ExitCode}}' mediaflux-v014-upgrade)
              case "$shutdown_exit" in
                0|143) ;;
                *) echo "Unexpected upgrade shutdown exit code: $shutdown_exit" >&2; exit 1 ;;
              esac
              docker logs mediaflux-v014-upgrade \
                > "$RUNNER_TEMP/docker-v014-shutdown.log" 2>&1
              grep -Fq "Application shutdown complete" \
                "$RUNNER_TEMP/docker-v014-shutdown.log"
              exit 0
            fi
            sleep 2
          done
          docker logs mediaflux-v014-upgrade
          exit 1

      - name: Cleanup smoke containers
        if: always()
        run: |
          docker rm --force mediaflux-smoke >/dev/null 2>&1 || true
          docker rm --force mediaflux-v014-upgrade >/dev/null 2>&1 || true

  build:
    # PR/main/tag 均通过 test + browser + amd64 smoke；多架构发布仅由版本标签触发。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Prepare build context
        id: context
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          TAG_NAME: ${{ github.ref_name }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY=$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          if [[ "$IS_TAG" == "true" ]]; then
            git fetch --force --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main"
            if ! git merge-base --is-ancestor "$BUILD_SHA" origin/main; then
              echo "Release tag target must be contained in origin/main" >&2
              exit 1
            fi
            SOURCE_VERSION=$(python -c 'from app import __version__; print(__version__)')
            if [[ "$TAG_NAME" != "v$SOURCE_VERSION" ]]; then
              echo "Release tag $TAG_NAME does not match source version v$SOURCE_VERSION" >&2
              exit 1
            fi
            export SOURCE_VERSION
            if ! python - <<'PY'
          import importlib.util
          import os
          import sys
          from pathlib import Path

          path = Path("packaging/scripts/generate_build_info.py")
          spec = importlib.util.spec_from_file_location("release_build_info", path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          section = module._changelog_section(
              Path("CHANGELOG.md").read_text(encoding="utf-8"),
              os.environ["SOURCE_VERSION"],
          )
          raise SystemExit(0 if section.strip() else 1)
          PY
            then
              echo "CHANGELOG.md is missing a dated, non-empty $SOURCE_VERSION section" >&2
              exit 1
            fi
            VERSION_REF="$TAG_NAME"
            RELEASE_BUILD=true
          else
            VERSION_REF=v0.0.0-dev
            RELEASE_BUILD=false
          fi
          BUILD_INFO_ARGS=()
          if [[ "$RELEASE_BUILD" != "true" ]]; then
            BUILD_INFO_ARGS+=(--development)
          fi
          python packaging/scripts/generate_build_info.py \
            --ref "$VERSION_REF" --commit "$BUILD_SHA" \
            --platform docker --arch multi --package runtime \
            --output "$RUNNER_TEMP/BUILD-INFO.json" \
            "${BUILD_INFO_ARGS[@]}"
          VERSION=$(jq -r '.version' "$RUNNER_TEMP/BUILD-INFO.json")
          STABLE=$(jq -r '(.prerelease | not)' "$RUNNER_TEMP/BUILD-INFO.json")
          DOCKER_VERSION=$(python packaging/scripts/docker_version_tag.py "$VERSION")
          SERIES=${VERSION%%[-+]*}
          SERIES=$(printf '%s' "$SERIES" | cut -d. -f1,2)
          SHORT_SHA=${BUILD_SHA:0:12}
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$BUILD_SHA")
          {
            echo "image_repository=$IMAGE_REPOSITORY"
            echo "version_ref=$VERSION_REF"
            echo "version=$VERSION"
            echo "docker_version=$DOCKER_VERSION"
            echo "source_sha=$BUILD_SHA"
            echo "short_sha=$SHORT_SHA"
            echo "source_date_epoch=$SOURCE_DATE_EPOCH"
            echo "stable=$STABLE"
            echo "series=$SERIES"
            echo "release_build=$RELEASE_BUILD"
            echo "candidate_tag=$IMAGE_REPOSITORY:sha-$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.context.outputs.candidate_tag }}
          build-args: |
            VERSION_REF=${{ steps.context.outputs.version_ref }}
            GIT_SHA=${{ steps.context.outputs.source_sha }}
            SOURCE_DATE_EPOCH=${{ steps.context.outputs.source_date_epoch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify candidate multi-architecture manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_REPOSITORY: ${{ steps.context.outputs.image_repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE_REPOSITORY@$IMAGE_DIGEST" --raw > "$RUNNER_TEMP/manifest.json"
          jq -e '
            [.manifests[].platform | "\(.os)/\(.architecture)"] as $platforms
            | ($platforms | index("linux/amd64")) != null
              and ($platforms | index("linux/arm64")) != null
          ' "$RUNNER_TEMP/manifest.json"

      - name: Smoke test candidate images
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_REPOSITORY: ${{ steps.context.outputs.image_repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.context.outputs.version }}
          EXPECTED_SHA: ${{ steps.context.outputs.source_sha }}
        run: |
          set -euo pipefail
          for platform_and_arch in "linux/amd64:x86_64" "linux/arm64:aarch64"; do
            platform=${platform_and_arch%%:*}
            expected_arch=${platform_and_arch#*:}
            image_arch=${platform#linux/}
            platform_digest=$(jq -r \
              --arg os linux --arg arch "$image_arch" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest' \
              "$RUNNER_TEMP/manifest.json")
            test -n "$platform_digest" && test "$platform_digest" != null
            safe_platform=${platform//\//-}
            output="$RUNNER_TEMP/docker-$safe_platform-version.json"
            image_reference="$IMAGE_REPOSITORY@$platform_digest"
            docker pull --quiet --platform "$platform" "$image_reference" >/dev/null
            docker run --rm --platform "$platform" --entrypoint python \
              "$image_reference" mediaflux.py version --json > "$output"
            jq -e --arg version "$EXPECTED_VERSION" --arg sha "$EXPECTED_SHA" \
              --arg arch "$expected_arch" \
              '.version == $version and .arch == $arch and .package == "docker" and .commit == $sha' \
              "$output" >/dev/null

            container="mediaflux-${safe_platform}-startup"
            docker run --detach --platform "$platform" --name "$container" \
              --env WEB_SECRET_KEY=ci-platform-secret-key-with-more-than-32-bytes \
              --env MEDIAFLUX_INITIALIZED=1 \
              --env ENV_WEB_PASSPORT=admin \
              --env ENV_WEB_PASSWORD=ci-platform-password-with-more-than-16-bytes \
              "$image_reference" >/dev/null
            ready=false
            echo "Waiting for $platform candidate readiness"
            for attempt in $(seq 1 45); do
              if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]]; then
                echo "$platform candidate exited before readiness" >&2
                docker logs "$container"
                docker rm --force "$container" >/dev/null 2>&1 || true
                exit 1
              fi
              if docker exec "$container" python -c \
                "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1258/readyz', timeout=3)" \
                >/dev/null 2>&1; then
                ready=true
                echo "$platform candidate ready (attempt $attempt)"
                break
              fi
              sleep 2
            done
            if [[ "$ready" != "true" ]]; then
              docker logs "$container"
              docker rm --force "$container" >/dev/null 2>&1 || true
              exit 1
            fi
            docker stop --timeout 60 "$container" >/dev/null
            shutdown_exit=$(docker inspect --format '{{.State.ExitCode}}' "$container")
            case "$shutdown_exit" in
              0|143) ;;
              *) echo "Unexpected $platform shutdown exit code: $shutdown_exit" >&2; exit 1 ;;
            esac
            shutdown_log="$RUNNER_TEMP/docker-${safe_platform}-shutdown.log"
            docker logs "$container" > "$shutdown_log" 2>&1
            grep -Fq "Application shutdown complete" "$shutdown_log"
            docker rm "$container" >/dev/null
          done

      - name: Re-verify release tag before promotion
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION_REF: ${{ steps.context.outputs.version_ref }}
          EXPECTED_SHA: ${{ steps.context.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "+refs/tags/$VERSION_REF:refs/tags/$VERSION_REF"
          test "$(git rev-list -n 1 "$VERSION_REF")" = "$EXPECTED_SHA"

      - name: Promote verified image tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_REPOSITORY: ${{ steps.context.outputs.image_repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.context.outputs.version }}
          DOCKER_VERSION: ${{ steps.context.outputs.docker_version }}
          SERIES: ${{ steps.context.outputs.series }}
          STABLE: ${{ steps.context.outputs.stable }}
          EXPECTED_SHA: ${{ steps.context.outputs.source_sha }}
        run: |
          set -euo pipefail
          exact="$IMAGE_REPOSITORY:$DOCKER_VERSION"
          promotion_digest="$IMAGE_DIGEST"
          existing_digest=""
          if existing_digest=$(bash packaging/scripts/inspect_registry_digest.sh "$exact"); then
            :
          else
            inspect_status=$?
            if [[ "$inspect_status" -ne 3 ]]; then
              echo "Unable to determine whether immutable tag $exact exists; refusing promotion" >&2
              exit "$inspect_status"
            fi
          fi
          if [[ -n "$existing_digest" && "$existing_digest" != "$IMAGE_DIGEST" ]]; then
            docker buildx imagetools inspect \
              "$IMAGE_REPOSITORY@$existing_digest" --raw \
              > "$RUNNER_TEMP/existing-exact-manifest.json"
            if ! jq -e '
              [.manifests[].platform | "\(.os)/\(.architecture)"] as $platforms
              | ($platforms | index("linux/amd64")) != null
                and ($platforms | index("linux/arm64")) != null
            ' "$RUNNER_TEMP/existing-exact-manifest.json" >/dev/null 2>&1; then
              echo "Immutable version tag $exact exists but cannot be verified; refusing overwrite" >&2
              exit 1
            fi
            reusable=true
            for platform_arch in "linux/amd64:x86_64" "linux/arm64:aarch64"; do
              platform=${platform_arch%%:*}
              expected_arch=${platform_arch##*:}
              safe_arch=${platform#linux/}
              platform_digest=$(jq -r \
                --arg os linux --arg arch "$safe_arch" \
                '.manifests[] | select(.platform.os == $os and .platform.architecture == $arch) | .digest' \
                "$RUNNER_TEMP/existing-exact-manifest.json")
              if [[ -z "$platform_digest" || "$platform_digest" == null ]]; then
                reusable=false
                break
              fi
              docker run --rm --platform "$platform" --entrypoint python \
                "$IMAGE_REPOSITORY@$platform_digest" mediaflux.py version --json \
                > "$RUNNER_TEMP/existing-exact-$safe_arch-version.json" 2>/dev/null || true
              if ! jq -e \
                --arg version "$VERSION" \
                --arg sha "$EXPECTED_SHA" \
                --arg arch "$expected_arch" \
                '.version == $version and .arch == $arch and .package == "docker" and .commit == $sha' \
                "$RUNNER_TEMP/existing-exact-$safe_arch-version.json" >/dev/null 2>&1; then
                reusable=false
                break
              fi
            done
            if [[ "$reusable" != "true" ]]; then
              echo "Immutable version tag $exact belongs to a different commit; refusing overwrite with $IMAGE_DIGEST" >&2
              exit 1
            fi
            promotion_digest="$existing_digest"
            echo "Reuse previously verified immutable tag $exact at $promotion_digest"
          fi

          tags=("$exact")
          if [[ "$STABLE" == "true" ]]; then
            for mutable_tag in "$IMAGE_REPOSITORY:$SERIES" "$IMAGE_REPOSITORY:latest"; do
              allow_mutable=true
              mutable_digest=""
              if mutable_digest=$(bash packaging/scripts/inspect_registry_digest.sh "$mutable_tag"); then
                safe_name=$(printf '%s' "$mutable_tag" | tr '/:.' '____')
                docker run --rm --platform linux/amd64 --entrypoint python \
                  "$IMAGE_REPOSITORY@$mutable_digest" mediaflux.py version --json \
                  > "$RUNNER_TEMP/docker-current-$safe_name.json"
                current_version=$(jq -r '.version' "$RUNNER_TEMP/docker-current-$safe_name.json")
                if ! python packaging/scripts/check_version_promotion.py "$VERSION" "$current_version"; then
                  allow_mutable=false
                  echo "Keep $mutable_tag on newer version $current_version"
                fi
              else
                inspect_status=$?
                if [[ "$inspect_status" -ne 3 ]]; then
                  echo "Unable to determine whether mutable tag $mutable_tag exists; refusing promotion" >&2
                  exit "$inspect_status"
                fi
              fi
              if [[ "$allow_mutable" == "true" ]]; then
                tags+=("$mutable_tag")
              fi
            done
          fi

          for tag in "${tags[@]}"; do
            docker buildx imagetools create --tag "$tag" "$IMAGE_REPOSITORY@$promotion_digest"
            promoted_digest=""
            for _ in {1..10}; do
              promoted_digest=$(docker buildx imagetools inspect "$tag" 2>/dev/null \
                | awk '$1 == "Digest:" {print $2; exit}' || true)
              if [[ "$promoted_digest" == "$promotion_digest" ]]; then
                break
              fi
              sleep 1
            done
            test "$promoted_digest" = "$promotion_digest"
          done

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_REF: ${{ steps.context.outputs.version_ref }}
          SOURCE_DATE_EPOCH: ${{ steps.context.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          RELEASE_ASSETS="$RUNNER_TEMP/release-assets"
          mkdir -p "$RELEASE_ASSETS"
          cp "$RUNNER_TEMP/BUILD-INFO.json" "$RELEASE_ASSETS/BUILD-INFO.json"
          export RELEASE_ASSETS
          python - <<'PY'
          import importlib.util, os
          from pathlib import Path
          p = Path('packaging/scripts/generate_build_info.py')
          s = importlib.util.spec_from_file_location('g', p)
          m = importlib.util.module_from_spec(s)
          import sys
          sys.modules[s.name] = m
          s.loader.exec_module(m)
          m.generate_release_notes(
              os.environ['VERSION_REF'],
              os.environ['GITHUB_REPOSITORY'],
              Path('CHANGELOG.md'),
              Path(os.environ['RELEASE_ASSETS']) / 'RELEASE-NOTES.txt',
          )
          PY
          python packaging/scripts/generate_sbom.py requirements-release-runtime.lock \
            --output "$RELEASE_ASSETS/PYTHON-DEPENDENCIES.spdx.json" \
            --namespace "https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION_REF"
          python packaging/scripts/generate_checksums.py "$RELEASE_ASSETS"
          git fetch --force --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          git fetch --force --no-tags origin \
            "+refs/tags/$VERSION_REF:refs/tags/$VERSION_REF"
          EXPECTED_SHA=$(jq -r '.commit' "$RUNNER_TEMP/BUILD-INFO.json")
          test "$(git rev-list -n 1 "$VERSION_REF")" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main

          PRERELEASE=()
          if jq -e '.prerelease == true' "$RUNNER_TEMP/BUILD-INFO.json" >/dev/null; then
            PRERELEASE=(--prerelease)
          fi
          if gh release view "$VERSION_REF" >/dev/null 2>&1; then
            EXISTING_RELEASE="$RUNNER_TEMP/existing-release"
            rm -rf "$EXISTING_RELEASE"
            mkdir -p "$EXISTING_RELEASE"
            if ! gh release download "$VERSION_REF" \
              --pattern BUILD-INFO.json --dir "$EXISTING_RELEASE"; then
              echo "Existing release $VERSION_REF has no verifiable BUILD-INFO.json; refusing overwrite" >&2
              exit 1
            fi
            EXISTING_RELEASE_SHA=$(jq -r '.commit // empty' \
              "$EXISTING_RELEASE/BUILD-INFO.json")
            if [[ "$EXISTING_RELEASE_SHA" != "$EXPECTED_SHA" ]]; then
              echo "Existing release $VERSION_REF belongs to $EXISTING_RELEASE_SHA, not $EXPECTED_SHA; refusing asset overwrite" >&2
              exit 1
            fi
          else
            gh release create "$VERSION_REF" \
              --title "MediaFlux $VERSION_REF" \
              --notes-file "$RELEASE_ASSETS/RELEASE-NOTES.txt" \
              "${PRERELEASE[@]}"
          fi
          gh release upload "$VERSION_REF" --clobber \
            "$RELEASE_ASSETS/BUILD-INFO.json" \
            "$RELEASE_ASSETS/RELEASE-NOTES.txt" \
            "$RELEASE_ASSETS/PYTHON-DEPENDENCIES.spdx.json" \
            "$RELEASE_ASSETS/SHA256SUMS"
