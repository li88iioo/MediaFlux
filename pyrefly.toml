preset = "basic"
python-interpreter-path = ".venv/bin/python"
search-path = [".", "packaging/scripts"]
project-includes = [
    "app/**/*.py",
    "tests/**/*.py",
    "packaging/**/*.py",
    "*.py",
]
ignore-missing-imports = [
    "anitomy_ng",
    "anitomy_ng.*",
    "playwright",
    "playwright.*",
]
