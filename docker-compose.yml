services:
  mediaflux:
    image: "ghcr.io/li88iioo/mediaflux:latest"
    container_name: mediaflux
    restart: unless-stopped
    stop_grace_period: 60s

    # 允许 MF 的 Python 子进程调用 Bubblewrap 创建隔离环境。
    # 外层放开这两项策略；内层仍 --cap-drop ALL、--unshare-all 并加载 seccomp。
    # 保留 Python 主进程入口，避免直接以 bwrap 为容器入口触发 AppArmor 重入限制。
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

    # host 模式会直接开放 Web 1258 和页面中配置的媒体反代端口。
    network_mode: host

    # 如需桥接端口：删除 network_mode，并取消下面注释。
    # ports:
    #   - "0.0.0.0:111:1258"
    #   - "0.0.0.0:222:18096"
    # 第二条右侧端口必须与页面中的媒体反代监听端口一致。

    volumes:
      - "./data:/app/db"
      - "./strm:/data/strm"
      # 按宿主机实际目录修改下面两行左侧路径。
      - "./downloads:/media/downloads"
      - "./library:/media/library"
