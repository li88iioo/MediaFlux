<dialog class="discovery-dialog" id="discovery-detail-dialog" aria-labelledby="discovery-detail-title">
    <div class="discovery-dialog-frame">
        <header class="discovery-dialog-head">
            <div>
                <h2 id="discovery-detail-title">CATALOGUE RECORD / 媒体档案</h2>
            </div>
            <button class="icon-btn" type="button" data-discovery-dialog-close aria-label="关闭" title="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
        </header>
        <aside class="discovery-dialog-notice" id="discovery-dialog-notice" data-discovery-dialog-notice role="status" aria-live="polite" hidden>
            <span class="discovery-dialog-notice-icon" id="discovery-dialog-notice-icon" aria-hidden="true"><i data-lucide="circle-check-big" aria-hidden="true"></i></span>
            <div class="discovery-dialog-notice-copy">
                <strong id="discovery-dialog-notice-title">下载状态</strong>
                <p id="discovery-dialog-notice-text"></p>
                <div class="discovery-dialog-notice-actions" id="discovery-dialog-notice-actions" hidden></div>
            </div>
            <button class="icon-btn discovery-dialog-notice-close" id="discovery-dialog-notice-close" type="button" aria-label="关闭资源通知"><i data-lucide="x" aria-hidden="true"></i></button>
        </aside>
        <div class="discovery-dialog-body" id="discovery-detail-body"></div>
    </div>
</dialog>
